    prefix: sw-arch
    doc_dir: ../../robarm-sw/docs/sw-arch
    version_project: robarm-sw
    builders: [html]
    needs: {source: json}
  sw-api:
    # Doxygen document, same kind as in robarm-sw's own registry.
    title: "SW API and Implementation"
    group: g-software
    kind: doxygen
    prefix: sw-api
    doc_dir: ../../robarm-sw/docs/sw-api
    version_project: robarm-sw
    needs: {source: json}
  sw-test-spec:
