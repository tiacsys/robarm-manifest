# shallow and carry ONLY the group `kicad-3d`: west makes a project active as soon as ONE of its
# groups is enabled, so with `[ee, kicad-3d]` the plain `ee` role would get them too. Only the
# roles ee3d and full (`+ee,+kicad-3d`) get them.
