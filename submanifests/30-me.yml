# Mechanical engineering (repo-topology.md §3, D88). Group `me`.
# The FreeCAD parts library (about 5.7 GB) is cloned shallow and carries ONLY the group
# `freecad-parts` (see 20-ee.yml for why). The roles me and full enable it (`+me,+freecad-parts`);
# the integration role leaves it out (D90).
manifest:
  remotes:
    - name: tiacsys
      url-base: https://github.com/tiacsys

  projects:
    - name: robarm-me
      remote: tiacsys
      revision: 45a8bdc448967f3e57323b134c41f443dfb5b4e2
      groups: [me]

    - name: FreeCAD-library
      url: https://github.com/FreeCAD/FreeCAD-library
      revision: f5ca01cdcaa2f69b9295a6382719c2d90628780c
      path: libs/freecad
      clone-depth: 1
      groups: [freecad-parts]
