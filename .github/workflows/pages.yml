# Publishes the full linked document set to GitHub Pages (D55, doc-architecture.md §5).
#
#   push to main               -> latest/
#   push of tag baseline/vX.Y.Z -> vX.Y.Z/   (one folder per baseline, D40, D54)
#   pull_request (these files), workflow_dispatch on any other ref -> dry run: build + site artifact
#   workflow_dispatch with root-only -> refresh only the root files (index, versions.json, switcher)
#
# The site lives on the branch `gh-pages` (Pages source: "deploy from a branch", gh-pages, /).
# Each publish checks the branch out, replaces ONLY its own version folder, rewrites the root files
# (scripts/pages/site.py) and pushes one commit. Other version folders are not touched, so every
# baseline stays published; a baseline folder is only rewritten by an explicit re-run on its tag.
# A push that loses a race is retried on the new branch head.
# (actions/deploy-pages would replace the whole site each time, research/zdocs.md §8.)
#
# Least privilege: `build` is xdmod's reusable workflow (curatrix-check.yml) with a read-only token.
# It runs the strict full-set docs build (`curatrix check robarm-manifest --only CK-A6`, the same
# build as `curatrix docs full`) in the integration role at EXACTLY the manifest's pins
# (`resolve-siblings: false`, no CAD content, D56; dry runs use D127 resolution like PR CI) and
# uploads the HTML. `publish` only runs
# site.py on that HTML and pushes gh-pages with a write token.
name: pages
on:
  push:
    branches: [main]
    tags: ["baseline/v*"]
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - scripts/pages/**
  workflow_dispatch:
    inputs:
      root-only:
        description: only refresh the root files of gh-pages (no docs build)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One run per version folder; a newer push to main supersedes a running latest/ build.
  # root-only runs have their own group, so they never cancel a latest/ build.
  group: pages-${{ github.ref }}-${{ inputs.root-only && 'root' || 'build' }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && !inputs.root-only }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  what:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.what.outputs.version }}
      publish: ${{ steps.what.outputs.publish }}
    steps:
      - name: What to publish
        id: what
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          ROOT_ONLY: ${{ inputs.root-only || false }}
        run: |
          publish=false; version=preview
          case "$REF" in
            refs/heads/main) version=latest ;;
            refs/tags/baseline/v*) version="${REF#refs/tags/baseline/}" ;;
          esac
          if [ "$EVENT" != pull_request ] && [ "$version" != preview ]; then publish=true; fi
          if [ "$ROOT_ONLY" = true ] && [ "$EVENT" = workflow_dispatch ]; then
            publish=true; version=root-only
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "### pages: version \`$version\`, publish: $publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: what
    if: needs.what.outputs.version != 'root-only'
    permissions:
      contents: read
    uses: tiacsys/xdmod/.github/workflows/curatrix-check.yml@main
    with:
      repo: robarm-manifest
      role: integration
      manifest-ref: ${{ github.sha }}
      # Publishing (latest, baselines): exactly the pins. Dry runs on PRs preview what PR CI sees
      # (D127 sibling resolution), so they also work while a pin is older than what CI needs.
      resolve-siblings: ${{ needs.what.outputs.publish != 'true' }}
      extra-args: --only CK-A6
    # uploads the artifact curatrix-robarm-manifest-pr with full/docs/deploy/html/

  dry-run:
    needs: [what, build]
    if: needs.what.outputs.publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: curatrix-robarm-manifest-pr
          path: art
      - name: Site into an empty folder
        run: |
          # the artifact root is the common folder of the uploaded paths (build/ or build/full/)
          html="$(find art -type d -path '*docs/deploy/html' | head -1)"
          python3 scripts/pages/site.py --site "$RUNNER_TEMP/site" \
            --html "$html" --version latest --ref "$GITHUB_REF" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: pages-site-dry-run
          path: ${{ runner.temp }}/site/
          include-hidden-files: true

  publish:
    needs: [what, build]
    if: >-
      always() && needs.what.outputs.publish == 'true' &&
      (needs.build.result == 'success' || needs.what.outputs.version == 'root-only')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # push to gh-pages
      pages: write             # request a Pages build after the push
    steps:
      - name: Manifest (site.py and the remote for gh-pages)
        # No sparse checkout here: the gh-pages worktree shares this repo's config, and a sparse
        # definition (scripts/) makes `git add` refuse every path outside it (latest/, vX.Y.Z/).
        uses: actions/checkout@v4
        with:
          path: repo

      - name: HTML of the full set
        if: needs.what.outputs.version != 'root-only'
        uses: actions/download-artifact@v4
        with:
          name: curatrix-robarm-manifest-pr
          path: art

      - name: Publish to gh-pages
        working-directory: repo
        env:
          VERSION: ${{ needs.what.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          site="$RUNNER_TEMP/site"
          html="$(find "$GITHUB_WORKSPACE/art" -type d -path '*docs/deploy/html' 2>/dev/null | head -1)"
          script="$PWD/scripts/pages/site.py"
          if [ "$VERSION" = root-only ]; then args=(); else
            [ -n "$html" ] && test -d "$html" || { echo "::error::no HTML in the artifact"; exit 1; }
            args=(--html "$html" --version "$VERSION" --ref "${GITHUB_REF#refs/*/}" --sha "$GITHUB_SHA"); fi
          for attempt in 1 2 3 4 5; do
            git worktree remove --force "$site" 2>/dev/null || rm -rf "$site"
            git worktree prune
            if git fetch -q --depth 1 origin gh-pages; then
              git worktree add -q --detach "$site" FETCH_HEAD
            else
              echo "gh-pages does not exist yet: starting it"
              git branch -D pages-orphan 2>/dev/null || true
              git worktree add -q --orphan -b pages-orphan "$site"
            fi
            python3 "$script" --site "$site" "${args[@]}"
            git -C "$site" add -A
            if git -C "$site" diff --cached --quiet; then echo "nothing changed"; exit 0; fi
            git -C "$site" commit -q -m "pages: $VERSION from ${GITHUB_REF#refs/*/} @ ${GITHUB_SHA::12}" \
              -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if git -C "$site" push -q origin HEAD:refs/heads/gh-pages; then
              echo "published $VERSION (attempt $attempt)"
              # The push normally starts "pages build and deployment" by itself; asking once more
              # costs nothing and covers the case that a GITHUB_TOKEN push does not.
              gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null || echo "::warning::could not request a Pages build"
              owner="${GITHUB_REPOSITORY%/*}"; repo="${GITHUB_REPOSITORY#*/}"
              echo "Published: https://${owner,,}.github.io/$repo/${VERSION/root-only/}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push rejected (gh-pages moved?); retrying"; sleep $((attempt * 5))
          done
          exit 1
