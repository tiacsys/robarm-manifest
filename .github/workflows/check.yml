# Thin caller of xdmod's reusable check workflow (template: xdmod/workflows/check.yml,
# repo-layouts.md §1). It runs `curatrix check robarm-manifest --stage pr --no-cad`, which builds
# the full document set without CAD content (D56).
#
# The manifest under check is this commit (manifest-ref), not main, so a PR that moves pins is
# checked with its own pins. The integration role gets every repo except the big libraries (D90).
#
# The bump bot (D89) and Pages publishing (D55) come in later tasks.
name: check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    uses: tiacsys/xdmod/.github/workflows/curatrix-check.yml@main
    with:
      repo: robarm-manifest
      role: integration
      manifest-ref: ${{ github.event.pull_request.head.sha || github.sha }}
